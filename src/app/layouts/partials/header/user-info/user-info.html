<button matButton [matMenuTriggerFor]="menu" class="account-icon" aria-label="Account icon">
  <mat-icon>account_circle</mat-icon>
  <span>{{ userName }}</span>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item>
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>
  <button mat-menu-item (click)="onLogout()">
    <mat-icon>logout</mat-icon>
    <span>Log out</span>
  </button>
</mat-menu>
