<mat-sidenav-container class="admin-container" autosize>
    <mat-sidenav mode="side" opened class="admin-sidenav" [class.collapsed]="sidenavService.isCollapsed()">
        <app-sidenav></app-sidenav>
    </mat-sidenav>
    <mat-sidenav-content class="admin-content-layout">
        <app-header></app-header>
        <main class="admin-main-body">
            <router-outlet></router-outlet>
        </main>
        <app-footer></app-footer>
    </mat-sidenav-content>
</mat-sidenav-container>
